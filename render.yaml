# This blueprint is prepared, not applied. Review paid service plans before creating resources.
services:
  - type: web
    name: panther-fx
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_MODE
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
  - type: worker
    name: panther-push
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run push:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: panther-fx
          envVarKey: NEXT_PUBLIC_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: panther-fx
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        fromService:
          type: web
          name: panther-fx
          envVarKey: NEXT_PUBLIC_VAPID_PUBLIC_KEY
      - key: VAPID_PRIVATE_KEY
        fromService:
          type: web
          name: panther-fx
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_SUBJECT
        fromService:
          type: web
          name: panther-fx
          envVarKey: VAPID_SUBJECT
  - type: cron
    name: panther-calendar-news
    runtime: node
    schedule: "* * * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run calendar:queue
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: panther-fx
          envVarKey: NEXT_PUBLIC_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: panther-fx
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
