name: Format Broadcast Center production PR
on:
  push:
    branches: [feature/broadcast-center-production]
    paths:
      - .github/workflows/format-broadcast-pr.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/page.tsx lib/engine/mt5.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx lib/engine/mt5.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to production admin and MT5 schema"
            git push
          fi
